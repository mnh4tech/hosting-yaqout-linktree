<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Your Page</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f2f2f2;
    padding: 32px 16px;
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .topbar h1 {
    font-size: 18px;
    color: #2b2b2b;
    margin: 0;
  }
  #logoutBtn {
    border: none;
    background: none;
    color: #7a4a30;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    font-size: 13px;
    color: #6b6b6b;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input[type="text"], input[type="tel"], input[type="url"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 18px;
    direction: ltr;
  }
  .logo-preview {
    width: 120px;
    height: 120px;
    object-fit: contain;
    border: 1px solid #eee;
    border-radius: 12px;
    margin-bottom: 12px;
    display: block;
  }
  input[type="file"] {
    margin-bottom: 18px;
    font-size: 14px;
  }
  button[type="submit"] {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #7a4a30;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .status {
    text-align: center;
    font-size: 14px;
    margin-top: 14px;
    display: none;
  }
  .status.success { color: #1e8449; }
  .status.error { color: #c0392b; }
  .checking {
    text-align: center;
    color: #6b6b6b;
    padding: 60px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="checking" class="checking">Checking sign-in...</div>

    <div id="app" style="display:none;">
      <div class="topbar">
        <h1>Edit Your Page</h1>
        <button id="logoutBtn" type="button">Sign out</button>
      </div>

      <div class="card">
        <form id="editForm">
          <label for="logoFile">Logo</label>
          <img id="logoPreview" class="logo-preview" src="" alt="Current logo">
          <input type="file" id="logoFile" accept="image/*">

          <label for="whatsapp">WhatsApp number</label>
          <input type="tel" id="whatsapp" placeholder="963 76 193 918" required>

          <label for="instagram">Instagram link</label>
          <input type="url" id="instagram" placeholder="https://www.instagram.com/yourpage" required>

          <label for="tiktok">TikTok link</label>
          <input type="url" id="tiktok" placeholder="https://www.tiktok.com/@yourpage" required>

          <button type="submit" id="saveBtn">Save changes</button>
          <p class="status" id="statusMsg"></p>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
    import { firebaseConfig, SITE_DOC_PATH } from "../firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const checkingEl = document.getElementById("checking");
    const appEl = document.getElementById("app");
    const form = document.getElementById("editForm");
    const statusMsg = document.getElementById("statusMsg");
    const saveBtn = document.getElementById("saveBtn");
    const logoPreview = document.getElementById("logoPreview");
    const logoFileInput = document.getElementById("logoFile");

    let currentLogoUrl = "";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      checkingEl.style.display = "none";
      appEl.style.display = "block";
      await loadData();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    async function loadData() {
      const snap = await getDoc(doc(db, SITE_DOC_PATH));
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById("whatsapp").value = data.whatsapp || "";
        document.getElementById("instagram").value = data.instagram || "";
        document.getElementById("tiktok").value = data.tiktok || "";
        currentLogoUrl = data.logoUrl || "";
        logoPreview.src = currentLogoUrl;
      }
    }

    logoFileInput.addEventListener("change", () => {
      const file = logoFileInput.files[0];
      if (file) {
        logoPreview.src = URL.createObjectURL(file);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";
      statusMsg.style.display = "none";

      try {
        let logoUrl = currentLogoUrl;
        const file = logoFileInput.files[0];
        if (file) {
          const ext = file.name.split(".").pop();
          const storageRef = ref(storage, `logos/yaqout.${ext}`);
          await uploadBytes(storageRef, file);
          logoUrl = await getDownloadURL(storageRef);
        }

        const whatsappDigits = document.getElementById("whatsapp").value.replace(/[^0-9]/g, "");

        await setDoc(doc(db, SITE_DOC_PATH), {
          whatsapp: whatsappDigits,
          instagram: document.getElementById("instagram").value.trim(),
          tiktok: document.getElementById("tiktok").value.trim(),
          logoUrl,
          updatedAt: serverTimestamp()
        }, { merge: true });

        currentLogoUrl = logoUrl;
        statusMsg.textContent = "Saved. Your page is updated.";
        statusMsg.className = "status success";
        statusMsg.style.display = "block";
      } catch (err) {
        statusMsg.textContent = "Something went wrong. Please try again.";
        statusMsg.className = "status error";
        statusMsg.style.display = "block";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
      }
    });
  </script>
</body>
</html>
